name: Android Release APK

# The auto build, in Neiro's shape: every push to main builds the one APK
# this fork ships — the signed arm64-v8a phone release — and nothing else.
on:
  push:
    branches: [main, dev]
    paths-ignore:
      - 'README.md'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**/*.md'
  workflow_dispatch:

# The Gradle wrapper JVM does not read gradle.properties, and its own
# connect timeout is a hardcoded 10s. Runners whose IPv6 route to the
# distribution CDN is blackholed die inside it; forcing IPv4 for every
# JVM the workflow starts (wrapper included) keeps the download on the
# route that answers.
env:
  JAVA_TOOL_OPTIONS: -Djava.net.preferIPv4Stack=true

jobs:
  build-arm64-release:
    name: Build Signed Arm64 v8a Release
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # the release build falls back to the debug key when the signing
      # secrets are absent (a fork of this fork), and that key lives here
      - name: Generate debug.keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # the fork's own release key, from the repository secrets; skipped
      # when absent so other forks still get a build, debug-signed
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/keystore/release.keystore
          fi

      - name: Build Signed Release APK (arm64-v8a)
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          # what makes these the official builds the module store answers; forks' runs never get it
          MODULE_STORE_KEY: ${{ secrets.MODULE_STORE_KEY }}
          LIBREFM_API_KEY: ${{ secrets.LIBREFM_API_KEY }}
          LIBREFM_SECRET: ${{ secrets.LIBREFM_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
        run: |
          ./gradlew assembleArm64GmsRelease --no-configuration-cache --console=plain --warning-mode summary

      - name: Verify APK signature
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER="$(find "$SDK/build-tools" -name apksigner -type f | sort | tail -1)"
          echo "Using $APKSIGNER"
          for apk in app/build/outputs/apk/arm64Gms/release/*.apk; do
            echo "--- $apk"
            "$APKSIGNER" verify --print-certs "$apk"
            sha256sum "$apk"
          done

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sora-arm64-v8a-release
          path: app/build/outputs/apk/arm64Gms/release/*.apk
          retention-days: 30

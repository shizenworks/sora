[versions]
androidGradlePlugin = "9.0.0"
json = "20251224"
# 2.4: kotlinx-serialization 1.12 (pulled in by Ktor 3.6) publishes iOS klibs older compilers cannot load.
# Matches Natune and Metrolist; KSP 2.3.10 is the KSP2 line Natune pairs with it.
kotlin = "2.4.21"
# Compose Multiplatform for :shared and :desktopApp. 1.10.x pairs with the androidx compose 1.10 line above,
# so the Android app resolves the same compose it already uses.
composeMultiplatform = "1.10.3"
composeMultiplatformMaterial3 = "1.10.0-alpha05"
# JetBrains stopped publishing icons after 1.7.3; its Android variant is androidx material-icons-core, the artifact the app uses
composeMultiplatformIcons = "1.7.3"
compose = "1.10.2"
lifecycle = "2.10.0"
material3 = "1.5.0-alpha18"
adaptive = "1.3.0-alpha09"
appcompat = "1.7.1"
media3 = "1.7.1"
# 1.8 is the first with the media category, so android auto draws mochy's own tabs and player instead of its plain browse lists
car-app = "1.8.0-rc01"
mediarouter = "1.8.1"
castFramework = "22.2.0"
room = "2.8.4"
sqlite = "2.6.2"
hilt = "2.60.1"
ktor = "3.6.0"
ksp = "2.3.10"
jsoup = "1.22.1"
coil = "3.3.0"
ucrop = "2.2.11"
guava = "33.5.0-jre"
coroutinesGuava = "1.10.2"
kotlinxDatetime = "0.8.0"
concurrentFutures = "1.3.0"
activity = "1.12.3"
hiltNavigation = "1.3.0"
# JetBrains' navigation-compose for shared screens: its Android variant resolves to the androidx artifact the app uses
cmpNavigation = "2.9.0"
datastore = "1.2.0"
# Metrolist's Koin; its compose artifacts build on compose 1.10.2, the line composeMultiplatform above is on
koin = "4.3.0-Beta1"
composeReorderable = "3.0.0"
shimmer = "1.3.3"
palette = "1.0.0"
apacheLang3 = "3.20.0"
brotli = "0.1.2"
desugaring = "2.1.5"
junit = "4.13.2"
timber = "5.0.1"
materialKolor = "4.1.1"
kuromojiIpadic = "0.9.0"
newpipeextractor = "v0.25.2"
innertubex = "v0.11.6"
# FFmpeg through JavaCV for the desktop audio engine; ffmpegDesktop must be the FFmpeg build of this javacpp release
javacpp = "1.5.14"
ffmpegDesktop = "8.1.2-1.5.14"
# dbus-java: pure-Java D-Bus client for the Linux MPRIS media session (MIT). Same release the Natune desktop uses.
dbusJava = "5.1.1"
tinypinyin = "2.0.3"
protobuf = "4.33.5"
# JmDNS: the desktop side of device discovery, the same library Metrolist uses
jmdns = "3.6.5"
protobufPlugin = "0.9.6"
smoothCorner = "v1.0.0"
lottie = "6.6.2"
work = "2.10.0"
coreSplashscreen = "1.2.0"
webkit = "1.12.1"


[libraries]
guava = { module = "com.google.guava:guava", version.ref = "guava" }
coroutines-guava = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-guava", version.ref = "coroutinesGuava" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutinesGuava" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutinesGuava" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.12.0" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
concurrent-futures = { module = "androidx.concurrent:concurrent-futures-ktx", version.ref = "concurrentFutures" }

gradle = { module = "com.android.tools.build:gradle", version.ref = "androidGradlePlugin" }
activity = { module = "androidx.activity:activity-compose", version.ref = "activity" }
hilt-navigation = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigation" }
datastore = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

compose-runtime = { module = "androidx.compose.runtime:runtime", version.ref = "compose" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
compose-ui-util = { module = "androidx.compose.ui:ui-util", version.ref = "compose" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose" }
compose-animation = { module = "androidx.compose.animation:animation-graphics", version.ref = "compose" }
compose-reorderable = { module = "sh.calvin.reorderable:reorderable", version.ref = "composeReorderable" }
squigglyslider = { module = "me.saket.squigglyslider:squigglyslider", version = "1.0.0" }

viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
# shared ViewModels: JetBrains publishes the same lifecycle number, and on Android it resolves to the androidx artifact above
cmp-navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "cmpNavigation" }
cmp-lifecycle-viewmodel-savedstate = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-savedstate", version.ref = "lifecycle" }
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }

material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
androidx-adaptive = { module = "androidx.compose.material3.adaptive:adaptive", version.ref = "adaptive" }
androidx-adaptive-layout = { module = "androidx.compose.material3.adaptive:adaptive-layout", version.ref = "adaptive" }
androidx-adaptive-navigation = { module = "androidx.compose.material3.adaptive:adaptive-navigation", version.ref = "adaptive" }
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core", version.ref = "compose" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version.ref = "compose" }

materialKolor = { module = "com.materialkolor:material-kolor", version.ref = "materialKolor" }

appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }

coil = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
coil-network-ktor = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }
coil-svg = { module = "io.coil-kt.coil3:coil-svg", version.ref = "coil" }
ucrop = { module = "com.github.yalantis:ucrop", version.ref = "ucrop" }

shimmer = { module = "com.valentinilk.shimmer:compose-shimmer", version.ref = "shimmer" }

palette = { module = "androidx.palette:palette-ktx", version.ref = "palette" }

media3 = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
androidx-annotation = { module = "androidx.annotation:annotation", version = "1.9.1" }
media3-okhttp = { module = "androidx.media3:media3-datasource-okhttp", version.ref = "media3" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
car-app = { module = "androidx.car.app:app", version.ref = "car-app" }
car-app-projected = { module = "androidx.car.app:app-projected", version.ref = "car-app" }
# android auto takes our session token in this library's type, and the car library only pulls it in at runtime
androidx-media = { module = "androidx.media:media", version = "1.7.0" }
media3-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
media3-dash = { module = "androidx.media3:media3-exoplayer-dash", version.ref = "media3" }
media3-cast = { module = "androidx.media3:media3-cast", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3-transformer = { module = "androidx.media3:media3-transformer", version.ref = "media3" }
media3-effect = { module = "androidx.media3:media3-effect", version.ref = "media3" }
# jellyfin's prebuilt ffmpeg audio decoder, google doesn't publish one; 1.6.1+2 is the build made against media3 1.7.1, bump it with media3
media3-ffmpeg = { module = "org.jellyfin.media3:media3-ffmpeg-decoder", version = "1.6.1+2" }

mediarouter = { module = "androidx.mediarouter:mediarouter", version.ref = "mediarouter" }
cast-framework = { module = "com.google.android.gms:play-services-cast-framework", version.ref = "castFramework" }

sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
jmdns = { module = "org.jmdns:jmdns", version.ref = "jmdns" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }

apache-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "apacheLang3" }

hilt = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }

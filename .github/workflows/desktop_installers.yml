name: Desktop installers

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/desktop_installers.yml'
      - 'desktopApp/**'
      - 'shared/build.gradle.kts'
      - 'gradle/libs.versions.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-installers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# drafts skip the paid macOS/Windows runners; marking a pull request ready runs them
jobs:
  package:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # pull requests package Linux only (operator, 2026-11-22: Android and Linux for now, for speed);
        # a manual run still packages all three
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '[{"platform":"linux-x64","runner":"ubuntu-latest"},{"platform":"macos-arm64","runner":"macos-26"},{"platform":"windows-x64","runner":"windows-2025"}]' || '[{"platform":"linux-x64","runner":"ubuntu-latest"}]') }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Prepare Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot rpm

      - name: Add WiX 3 to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Get-Command candle.exe -ErrorAction SilentlyContinue) { exit 0 }
          $wix = Get-ChildItem "${env:ProgramFiles(x86)}" -Directory -Filter 'WiX Toolset v3*' |
              Where-Object { Test-Path (Join-Path $_.FullName 'bin\candle.exe') } |
              Select-Object -First 1
          if (-not $wix) { throw 'WiX 3 is required by JDK 21 to package the MSI.' }
          (Join-Path $wix.FullName 'bin') >> $env:GITHUB_PATH

      - name: Build the native installers
        if: runner.os != 'Windows'
        run: ./gradlew --console=plain -Dorg.gradle.configureondemand=true :desktopApp:packageDistributionForCurrentOS

      - name: Build the MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./gradlew.bat --console=plain "-Dorg.gradle.configureondemand=true" :desktopApp:packageMsi

      - name: Upload installers
        uses: actions/upload-artifact@v6
        with:
          name: Mochy-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            desktopApp/build/compose/binaries/main/**/*.deb
            desktopApp/build/compose/binaries/main/**/*.rpm
            desktopApp/build/compose/binaries/main/**/*.dmg
            desktopApp/build/compose/binaries/main/**/*.msi
